<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault — Your Games. Your Universe.</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/gamevault.css" />
    <script src="js/storage.js"></script>
</head>

<body class="bg-[#0B0F19] text-[#F8FAFC] font-sans antialiased selection:bg-[#8B5CF6]/30 selection:text-white min-h-screen">
    <div id="app">
        <div class="fixed inset-0 flex flex-col items-center justify-center bg-[#0B0F19] text-[#F8FAFC] z-50">
            <div class="relative flex items-center justify-center w-20 h-20 mb-6">
                <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-[#8B5CF6] to-[#22D3EE] opacity-25 blur-xl animate-pulse"></div>
                <div class="relative w-16 h-16 rounded-2xl bg-[#151B2D] border border-[#273247] flex items-center justify-center shadow-2xl">
                    <svg class="w-9 h-9 text-[#8B5CF6] animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" x2="10" y1="12" y2="12"/>
                        <line x1="8" x2="8" y1="10" y2="14"/>
                        <line x1="15" x2="15.01" y1="13" y2="13"/>
                        <line x1="18" x2="18.01" y1="11" y2="11"/>
                        <rect width="20" height="12" x="2" y="6" rx="6"/>
                    </svg>
                </div>
            </div>
            <div class="text-2xl font-bold tracking-wider font-heading text-white mb-2">GAMEVAULT</div>
            <div class="text-sm text-[#94A3B8] font-medium tracking-wide">Loading your gaming universe...</div>
            <div class="w-48 h-1 bg-[#151B2D] rounded-full overflow-hidden mt-6">
                <div class="h-full bg-gradient-to-r from-[#8B5CF6] to-[#22D3EE] rounded-full animate-[shimmer_1.5s_infinite]"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 max-w-md bg-[#EF4444] text-white p-4 rounded-xl shadow-2xl z-50 flex items-center justify-between gap-4">
        <span>An unhandled error has occurred.</span>
        <div class="flex items-center gap-2">
            <a href="." class="px-2 py-1 bg-white/20 hover:bg-white/30 rounded font-semibold text-sm">Reload</a>
            <span class="cursor-pointer font-bold px-1" onclick="document.getElementById('blazor-error-ui').style.display='none'">✕</span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
